<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="shortcut icon" href="img/2_character_pepe/1_idle/idle/I-2.png" type="image/x-icon">
    <title>El pollo loco</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div id="canvas-container" class="canvas-container">
    <div id="mobile-controls">
            <div class="control-group">
                <img src="img/button/left.png" id="btn-left" class="control-btn" alt="Left">
                <img src="img/button/right.png" id="btn-right" class="control-btn" alt="Right">
            </div>

            <div class="control-group">
                <img src="img/button/jump.png" id="btn-jump" class="  control-btn" alt="Jump">

                <img src="img/button/bottle.png" id="btn-bottle" class=" control-btn" alt="Bottle">
            </div>
        </div>
    <button class=" d-none sound_icon" id="soundToggleBtn" onclick="toggleGameSound()">
    <img id="volumen" src="img/9_intro_outro_screens/start/volume.png" alt="volumen">
    <img id="mute" class="mute d-none" src="img/9_intro_outro_screens/start/mute.png" alt="mute">
    </button>
    
    
    <button id="fullscreen" onclick="openFullscreen()" class=" d-none fullscreen "><img src="img/9_intro_outro_screens/start/fullscreen.png" alt="fullscreen_button"></button>
    
    <button id="reset" onclick="restartGame()" class=" d-none restart "><img src="img/9_intro_outro_screens/start/restart.png" alt="reset_button"></button>
    
    <canvas class="d-none" id="canvas" width="960" height="540"></canvas>

    </div>
    
    <div id="game-over-screen" class="game-over-container d-none">
    <img class="gameover-image"src="img/You won, you lost/gemeover.png">
     <button onclick="restartGameOver()" id="restart-gameover" class=" d-none restart-butten-gameover">
        <img  src="img/9_intro_outro_screens/start/reStartbutten.png" alt="start-button">
    </button>
    <button onclick="backToStart()" id="menu-gameover" class="d-none menu-butten-gameover">
        <img  src="img/9_intro_outro_screens/start/Menu.png" alt="menu-button">
    </button>
    </div>

      <div id="you-win-screen" class="you-win-container d-none">
    <img class="you-win-image"src="img/You won, you lost/youwin.png">
    <button onclick="backToStart()" id="menu-you-win" class="d-none menu-butten-youwin">
        <img  src="img/9_intro_outro_screens/start/Menu.png" alt="menu-button">
    </button>
    </div>
    
   
    <div id="menu" class="start-menu">
        <button onclick="startGame()" id="startGame" class="start-img">
        <img class="butten-img" src="img/9_intro_outro_screens/start/Start.png" alt="start-button">
        </button>

        <button onclick="openDialog()" class="info-img">
        <img class="butten-img" src="img/9_intro_outro_screens/start/INFO.png" alt="INFO-button">
        </button>
    </div>

    <dialog onclick="closeDialog()" id="dialog">
        <div class="Information">
            <img class="Information-image" src="img/9_intro_outro_screens/start/infomation.png" alt="">
        </div>
    </dialog>
   
</body>
  <script src="models/drawable-object.class.js"></script>
    <script src="models/movable-object.class.js"></script>
    <script src="models/character.class.js"></script>
    <script src="models/small-chicken.class.js"></script>
    <script src="models/chicken.class.js"></script>
    <script src="models/bottle.class.js"></script>
    <script src="models/coins.class.js"></script>
    <script src="models/cloud.class.js"></script>
    <script src="models/background-object.class.js"></script>
    <script src="models/keyboard.class.js"></script>
    <script src="models/collidable-object.class.js"></script>
    <script src="models/level.class.js"></script>  
    <script src="models/status-bar.class.js"></script>
    <script src="models/statusbar-coin.class.js"></script>
    <script src="models/statusbar-bottle.class.js"></script>
    <script src="models/throwable-object.class.js"></script>
    <script src="models/endboss-statusbar.class.js"></script>
    <script src="models/endboss.class.js"></script>
    <script src="level/level1.js"></script>  
    <script src="models/world.class.js"></script>
    <script src="models/sound.class.js"></script>
    <script src="js/game.js"></script>

</html>
