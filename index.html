<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="shortcut icon" href="img/2_character_pepe/1_idle/idle/I-2.png" type="image/x-icon">
    <title>El pollo loco</title>
    <link rel="stylesheet" href="style.css">
    
</head>

<body>

    <h1 id="h1-image"><img src="img/5_background/h1.png" alt="hero-text"></h1>
    <div id="canvas-container" class="canvas-container">
    <div id="mobile-controls">

    <div class="control-group">
       <img src="img/button/left.png" id="btn-left" class="control-btn" alt="Left">
       <img src="img/button/right.png" id="btn-right" class="control-btn" alt="Right">
    </div>

    <div class="control-group">
        <img src="img/button/jump.png" id="btn-jump" class="  control-btn" alt="Jump">
        <img src="img/button/bottle.png" id="btn-bottle" class=" control-btn" alt="Bottle">  
    </div>
    </div>
    <button class=" d-none sound_icon" id="soundToggleBtn" onclick="toggleGameSound()">
        <img id="volumen" src="img/9_intro_outro_screens/start/volume.png" alt="volumen">
        <img id="mute" class="mute d-none" src="img/9_intro_outro_screens/start/mute.png" alt="mute">
    </button>

    <button id="fullscreen" onclick="openFullscreen()" class=" d-none fullscreen ">
        <img src="img/9_intro_outro_screens/start/fullscreen.png" alt="fullscreen_button">
    </button>

     <button id="home" onclick="backToStart()" class=" d-none home  ">
        <img src="img/9_intro_outro_screens/start/home.png" alt="fullscreen_button">
    </button>

    <button id="reset" onclick="restartGame()" class=" d-none restart ">
        <img src="img/9_intro_outro_screens/start/restart.png" alt="reset_button">
    </button>
        <canvas class="d-none" id="canvas" width="960" height="540"></canvas>

        
          <div id="game-over-screen" class="game-over-container d-none ">
        <img class="gameover-image" src="img/You won, you lost/gemeover.png">
        <button onclick="restartGameOver()" id="restart-gameover" class=" d-none restart-butten-gameover">
            <img src="img/9_intro_outro_screens/start/reStartbutten.png" alt="start-button">
        </button>
        <button onclick="backToStart()" id="menu-gameover" class="d-none menu-butten-gameover">
            <img src="img/9_intro_outro_screens/start/Menu.png" alt="menu-button">
        </button>
    </div>
    </div>

  

    <div id="you-win-screen" class="you-win-container d-none">
        <img class="you-win-image" src="img/You won, you lost/youwin.png">
        <button onclick="backToStart()" id="menu-you-win" class="d-none menu-butten-youwin">
            <img src="img/9_intro_outro_screens/start/Menu.png" alt="menu-button">
        </button>
    </div>

    <div id="menu" class="start-menu">
        <button onclick="startGame()" id="startGame" class="start-img">
            <img class="butten-img" src="img/9_intro_outro_screens/start/Start.png" alt="start-button">
        </button>

        <button onclick="openDialog()" class="info-img">
            <img class="butten-img" src="img/9_intro_outro_screens/start/INFO.png" alt="INFO-button">
        </button>

         <button onclick="openImpressum()" class="info-img">
            <img class="butten-img" src="img/9_intro_outro_screens/start/inpressum.png" alt="INFO-button">
        </button>
    </div>

    <dialog onclick="closeImpresum()" id="impressum-close">
        <div class="Information">
            <img class="Information-image" src="img/9_intro_outro_screens/start/inpressum1.png" alt="impressum">
        </div>
    </dialog>


    <dialog onclick="closeDialog()" id="dialog">
        <div class="Information">
            <img class="Information-image" src="img/9_intro_outro_screens/start/infomation.png" alt="">
        </div>
    </dialog>

    <div id="rotate-warning" class="rotate-warning d-none">
        <img src="img/9_intro_outro_screens/start/—Pngtree—rotate your phone icon red_20417740.png" alt="Bitte drehen">
    </div>

</body>
<!-- Base Objects -->
<script src="classes/objects/drawable-object.class.js"></script>
    <script src="classes/objects/movable-object.class.js"></script>
    <script src="classes/objects/collidable-object.class.js"></script>
    <!-- Characters -->
    <script src="classes/characters/character.class.js"></script>
    <script src="classes/characters/small-chicken.class.js"></script>
    <script src="classes/characters/chicken.class.js"></script>
    <script src="classes/characters/endboss.class.js"></script>
    <!-- Collectibles -->
    <script src="classes/collectibles/bottle.class.js"></script>
    <script src="classes/collectibles/coins.class.js"></script>
    <script src="classes/collectibles/throwable-object.class.js"></script>
    <!-- World -->
    <script src="classes/world/cloud.class.js"></script>
    <script src="classes/world/background-object.class.js"></script>
    <!-- Input -->
    <script src="classes/input/keyboard.class.js"></script>
    <!-- Level -->
    <script src="level/level.class.js"></script>
    <!-- Statusbars -->
    <script src="classes/statusbars/status-bar.class.js"></script>
    <script src="classes/statusbars/statusbar-coin.class.js"></script>
    <script src="classes/statusbars/statusbar-bottle.class.js"></script>
    <script src="classes/statusbars/endboss-statusbar.class.js"></script>
    <!-- Level 1 -->
    <script src="level/level1.js"></script>
    <!-- World Manager -->
    <script src="classes/world/world.class.js"></script>
    <!-- Sound -->
    <script src="classes/sound/sound.class.js"></script>
    <script src="js/game.js"></script>
</html>
